<div class="app-shell">
  <header class="shell-header">
    <div class="header-inner">
      <a routerLink="/" class="brand" aria-label="Home">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-text">Bazaar<span class="brand-accent">TN</span></span>
      </a>

      <nav class="nav" aria-label="Main">
        <a routerLink="/listings" routerLinkActive="active" class="nav-link">Buy</a>
        <a routerLink="/register" routerLinkActive="active" class="nav-link">Register</a>
        <a routerLink="/login" routerLinkActive="active" class="nav-link">Login</a>
        <a routerLink="/listings/new" routerLinkActive="active" class="nav-cta">Sell in India</a>
      </nav>

      <div class="header-user">
        @if (auth.currentUser(); as u) {
          <span class="user-chip" title="Signed in">
            <span class="user-avatar" aria-hidden="true">{{ u.fullName.charAt(0) | uppercase }}</span>
            <span class="user-name">{{ u.fullName }}</span>
          </span>
          <button type="button" class="btn-logout" (click)="auth.logout()">Sign out</button>
        }
      </div>
    </div>
  </header>

  <app-error-banner />

  <main class="shell-main">
    <router-outlet />
  </main>

  <footer class="shell-footer">
    <span>India local deals, one trusted app.</span>
  </footer>
</div>
